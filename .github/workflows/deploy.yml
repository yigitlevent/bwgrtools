name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Build jobs ──────────────────────────────────────────────────────────────
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: shared
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          VITE_ENV: prod
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: client-dist
          path: client/dist/
          retention-days: 1

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: shared
      - run: npm ci
        working-directory: api
      - run: npm run build
        working-directory: api
      - name: Stage artifact
        run: |
          mkdir -p api-artifact
          cp -r api/dist api-artifact/
          cp api/package.json api/package-lock.json api-artifact/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: api-artifact
          path: api-artifact/
          retention-days: 1

  # ── Deploy all built artifacts to the server ────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-client, build-api]
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSHKEY }}

      - name: Trust server host key
        run: |
          ssh-keyscan -p ${{ secrets.PORT }} -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - uses: actions/download-artifact@v8.0.1
        with:
          name: client-dist
          path: client-dist/

      - uses: actions/download-artifact@v8.0.1
        with:
          name: api-artifact
          path: api-artifact/

      # ── Client ──────────────────────────────────────────────────────────────
      - name: Deploy client
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.PORT }}" \
            client-dist/ \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.TARGETDIR }}/bwgrtools/client/

      # ── API ─────────────────────────────────────────────────────────────────
      - name: Deploy API
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.PORT }}" \
            api-artifact/ \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/opt/bwgrtools/api/

      - name: Install API production dependencies
        run: |
          ssh -p ${{ secrets.PORT }} ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "cd /opt/bwgrtools/api && npm ci --omit=dev"

      # ── Shared (always synced for the migration runner) ─────────────────────
      - name: Sync shared directory
        run: |
          rsync -az \
            -e "ssh -p ${{ secrets.PORT }}" \
            shared/ \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/opt/bwgrtools/shared/

      # ── Database migrations ─────────────────────────────────────────────────
      - name: Run database migrations
        run: |
          ssh -p ${{ secrets.PORT }} ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "cd /opt/bwgrtools/shared && npx tsx db/migrate.ts"

      # ── Restart PM2 process ─────────────────────────────────────────────────
      # PM2's restart/start/save subcommands print the FULL process table as a side effect,
      # including every other app on this shared server — not
      # something to leak into a public/shared CI log. `pm2 id <name>` scopes status output
      # to just this app; stdout is discarded on restart/start/save since none of them emit
      # anything else worth keeping, while stderr still surfaces real failures.
      - name: Restart API
        run: |
          ssh -p ${{ secrets.PORT }} ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "(pm2 restart bwgrtools-api --update-env || pm2 start /opt/bwgrtools/ecosystem.config.cjs --only bwgrtools-api) >/dev/null"

      - name: Verify API is online
        run: |
          ssh -p ${{ secrets.PORT }} ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "pm2 jlist | node -e \"const apps=JSON.parse(require('fs').readFileSync(0,'utf8')); const app=apps.find(a=>a.name==='bwgrtools-api'); if (!app || app.pm2_env.status!=='online') { console.error('bwgrtools-api is not online'); process.exit(1); } console.log('bwgrtools-api online');\""

      - name: Save PM2 process list
        run: |
          ssh -p ${{ secrets.PORT }} ${{ secrets.USERNAME }}@${{ secrets.HOST }} "pm2 save >/dev/null"
